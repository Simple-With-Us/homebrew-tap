# Trusted autofix policy for this repository (read from the default branch only).
# PR-branch .autofix.yml may still narrow allowed_bots; it must not change model,
# turn budget, iteration cap, or verify commands.

model: MiniMax-M3.1-Flash-Preview
max_turns: 60
max_iterations: 5
verify_command: |
  set -euo pipefail
  shopt -s nullglob
  files=(Casks/*.rb Formula/*.rb)
  if [ ${#files[@]} -eq 0 ]; then echo "No formula/cask files found"; exit 1; fi
  for f in "${files[@]}"; do echo "--- $f"; ruby -c "$f"; done
