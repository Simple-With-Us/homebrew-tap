name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ruby syntax check (Casks/Formulae)
        run: |
          set -e
          shopt -s nullglob
          files=(Casks/*.rb Formula/*.rb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No formula/cask files found"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "--- $f"
            ruby -c "$f"
          done
